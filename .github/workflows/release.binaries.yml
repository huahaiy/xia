name: Release Binaries

on:
  # push:
  workflow_dispatch:
  release:
    types:
      - created

permissions:
  contents: read

env:
  GRAALVM_VERSION: "25.1.3"
  GRYPE_VERSION: "v0.110.0"

jobs:
  test:
    name: JVM Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: "21.0.8+9"

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20.15.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          lein: "2.11.2"

      - name: Cache Leiningen dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.lein/self-installs
          key: lein-${{ runner.os }}-java-21.0.8-lein-2.11.2-${{ hashFiles('build/dependencies.edn', 'project.clj') }}
          restore-keys: |
            lein-${{ runner.os }}-

      - name: Prefetch dependencies
        run: lein deps

      - name: Run test suite
        run: lein test

      - name: Install frontend tooling dependencies
        run: npm ci --ignore-scripts

      - name: Audit frontend tooling dependencies
        run: npm audit --audit-level=high --ignore-scripts

      - name: Test Unix installer checksum enforcement
        run: sh test/install_checksum_test.sh

      - name: Test PowerShell installer checksum enforcement
        shell: pwsh
        run: ./test/install_checksum_test.ps1

  build:
    name: Native ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: macos-arm64
            binary-name: xia
          - runner: ubuntu-24.04
            target: linux-amd64
            binary-name: xia
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            binary-name: xia
          - runner: windows-2025
            target: windows-amd64
            binary-name: xia.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js for SBOM validation
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20.15.0"

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          lein: "2.11.2"

      - name: Cache Leiningen dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.lein/self-installs
          key: lein-${{ runner.os }}-${{ matrix.target }}-graal-${{ env.GRAALVM_VERSION }}-lein-2.11.2-${{ hashFiles('build/dependencies.edn', 'project.clj', 'resources/META-INF/native-image/**') }}
          restore-keys: |
            lein-${{ runner.os }}-${{ matrix.target }}-
            lein-${{ runner.os }}-

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1.6.3
        with:
          distribution: graalvm
          java-version: ${{ env.GRAALVM_VERSION }}
          components: native-image
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Visual Studio shell
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Prefetch dependencies
        run: lein with-profile -user,-dev,+release deps

      - name: Compute artifact names
        id: names
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="manual-${GITHUB_SHA::7}"
          fi
          archive="xia-${version}-${{ matrix.target }}.zip"
          folder="xia-${version}-${{ matrix.target }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "folder=$folder" >> "$GITHUB_OUTPUT"

      - name: Build native binary (Unix)
        if: runner.os != 'Windows'
        run: bash script/compile-native

      - name: Build native binary (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call script\compile-native.bat

      - name: Smoke test native binary (Unix)
        if: runner.os != 'Windows'
        run: ./target/native-image/xia --help > /dev/null

      - name: Smoke test native binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\target\native-image\xia.exe --help > $null

      - name: Set up pinned Maven for SBOM generation (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          maven_home="$(sh script/setup-maven)"
          echo "$maven_home/bin" >> "$GITHUB_PATH"

      - name: Set up pinned Maven for SBOM generation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $mavenHome = ./script/setup-maven.ps1
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $mavenHome "bin")

      - name: Generate release SBOM (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          sbom="xia-${{ steps.names.outputs.version }}-${{ matrix.target }}.cdx.json"
          sh script/generate-sbom \
            "${{ steps.names.outputs.version }}" \
            "${{ matrix.target }}" \
            "target/native-image/${{ matrix.binary-name }}" \
            "$sbom"

      - name: Generate release SBOM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sbom = "xia-${{ steps.names.outputs.version }}-${{ matrix.target }}.cdx.json"
          ./script/generate-sbom.ps1 `
            -Version "${{ steps.names.outputs.version }}" `
            -Target "${{ matrix.target }}" `
            -NativeBinary "target/native-image/${{ matrix.binary-name }}" `
            -OutputPath $sbom

      - name: Prepare dependency scan report directory
        shell: bash
        run: mkdir -p target/security

      - name: Scan release dependency graph
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: xia-${{ steps.names.outputs.version }}-${{ matrix.target }}.cdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: json
          output-file: target/security/xia-${{ matrix.target }}.grype.json
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: true

      - name: Upload dependency scan report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dependency-scan-${{ matrix.target }}
          path: target/security/xia-${{ matrix.target }}.grype.json
          if-no-files-found: warn
          retention-days: 14

      - name: Package native binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          folder="dist/${{ steps.names.outputs.folder }}"
          mkdir -p "$folder"
          cp "target/native-image/${{ matrix.binary-name }}" "$folder/${{ matrix.binary-name }}"
          cp README.md LICENSE "$folder/"
          cp "xia-${{ steps.names.outputs.version }}-${{ matrix.target }}.cdx.json" "$folder/SBOM.cdx.json"
          (
            cd dist
            zip -r "../${{ steps.names.outputs.archive }}" "${{ steps.names.outputs.folder }}"
          )
          shasum -a 256 "${{ steps.names.outputs.archive }}" > "${{ steps.names.outputs.archive }}.sha256"

      - name: Package native binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $folder = Join-Path "dist" "${{ steps.names.outputs.folder }}"
          New-Item -ItemType Directory -Path $folder -Force | Out-Null
          Copy-Item "target/native-image/${{ matrix.binary-name }}" (Join-Path $folder "${{ matrix.binary-name }}")
          Copy-Item "README.md","LICENSE" $folder
          Copy-Item "xia-${{ steps.names.outputs.version }}-${{ matrix.target }}.cdx.json" (Join-Path $folder "SBOM.cdx.json")
          Compress-Archive -Path $folder -DestinationPath "${{ steps.names.outputs.archive }}" -Force
          $hash = (Get-FileHash "${{ steps.names.outputs.archive }}" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "${{ steps.names.outputs.archive }}.sha256" -Value "$hash  ${{ steps.names.outputs.archive }}"

      - name: Generate release provenance
        id: provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            ${{ steps.names.outputs.archive }}
            ${{ steps.names.outputs.archive }}.sha256
            xia-${{ steps.names.outputs.version }}-${{ matrix.target }}.cdx.json

      - name: Preserve provenance bundle (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          cp
          "${{ steps.provenance.outputs.bundle-path }}"
          "xia-${{ steps.names.outputs.version }}-${{ matrix.target }}.provenance.sigstore.json"

      - name: Preserve provenance bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Copy-Item
          "${{ steps.provenance.outputs.bundle-path }}"
          "xia-${{ steps.names.outputs.version }}-${{ matrix.target }}.provenance.sigstore.json"

      - name: Verify release provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROVENANCE_BUNDLE: xia-${{ steps.names.outputs.version }}-${{ matrix.target }}.provenance.sigstore.json
          SIGNER_WORKFLOW: ${{ github.repository }}/.github/workflows/release.binaries.yml
        run: |
          set -euo pipefail
          gh attestation verify \
            "${{ steps.names.outputs.archive }}" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROVENANCE_BUNDLE" \
            --signer-workflow "$SIGNER_WORKFLOW"
          gh attestation verify \
            "${{ steps.names.outputs.archive }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROVENANCE_BUNDLE" \
            --signer-workflow "$SIGNER_WORKFLOW"
          gh attestation verify \
            "xia-${{ steps.names.outputs.version }}-${{ matrix.target }}.cdx.json" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$PROVENANCE_BUNDLE" \
            --signer-workflow "$SIGNER_WORKFLOW"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ steps.names.outputs.archive }}
            ${{ steps.names.outputs.archive }}.sha256
            xia-${{ steps.names.outputs.version }}-${{ matrix.target }}.cdx.json
            xia-${{ steps.names.outputs.version }}-${{ matrix.target }}.provenance.sigstore.json
          if-no-files-found: error
          retention-days: 14

  canary:
    name: Validate Release Candidate
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js for release validation
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20.15.0"

      - name: Compute release candidate version
        id: names
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="manual-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download packaged binaries
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: xia-playwright-${{ runner.os }}-${{ hashFiles('build/dependencies.edn') }}

      - name: Run packaged release canary
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash script/release-canary
          release-assets
          "${{ steps.names.outputs.version }}"

      - name: Preserve validated release candidate
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: |
            release-assets/*.zip
            release-assets/*.sha256
            release-assets/*.cdx.json
            release-assets/*.sigstore.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    name: Publish Release Assets
    if: github.event_name == 'release'
    needs: canary
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download validated release candidate
        uses: actions/download-artifact@v8.0.1
        with:
          name: release-candidate-${{ github.run_id }}
          path: release-assets

      - name: Upload assets to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload \
            "$RELEASE_TAG" \
            release-assets/*.zip \
            release-assets/*.sha256 \
            release-assets/*.cdx.json \
            release-assets/*.sigstore.json \
            --clobber
