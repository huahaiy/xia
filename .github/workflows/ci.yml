name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21.0.8+9.0.LTS"
  LEIN_VERSION: "2.11.2"
  GRAALVM_VERSION: "25.1.3"
  GRYPE_VERSION: "v0.110.0"

jobs:
  format:
    name: Clojure format
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Xia
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          lein: ${{ env.LEIN_VERSION }}

      - name: Cache Clojure dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.lein/self-installs
          key: xia-lein-${{ runner.os }}-java-${{ env.JAVA_VERSION }}-lein-${{ env.LEIN_VERSION }}-${{ hashFiles('build/dependencies.edn', 'project.clj') }}

      - name: Check formatting
        run: lein with-profile -user,+quality cljfmt check

  lint:
    name: Clojure lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Xia
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Clojure tools
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          lein: ${{ env.LEIN_VERSION }}
          clj-kondo: "2026.05.25"

      - name: Cache Clojure dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.lein/self-installs
          key: xia-lein-${{ runner.os }}-java-${{ env.JAVA_VERSION }}-lein-${{ env.LEIN_VERSION }}-${{ hashFiles('build/dependencies.edn', 'project.clj') }}

      - name: Run clj-kondo
        run: clj-kondo --lint src test --fail-level error

      - name: Run Eastwood (advisory baseline)
        continue-on-error: true
        run: lein with-profile -user,+quality eastwood

  security-tests:
    name: Security invariants
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Xia
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          lein: ${{ env.LEIN_VERSION }}

      - name: Cache Clojure dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.lein/self-installs
          key: xia-lein-${{ runner.os }}-java-${{ env.JAVA_VERSION }}-lein-${{ env.LEIN_VERSION }}-${{ hashFiles('build/dependencies.edn', 'project.clj') }}

      - name: Run security boundary suites
        run: >-
          lein with-profile -user test
          xia.sci-env-test
          xia.secret-test
          xia.ssrf-test
          xia.web-ssrf-test
          xia.browser-egress-proxy-test
          xia.channel.http-test
          xia.crypto-test
          xia.plugin-test
          xia.permission-test
          xia.db-security-test
          xia.pack-security-test
          xia.runtime-overlay-test

  jvm-tests:
    name: JVM tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Xia
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          lein: ${{ env.LEIN_VERSION }}

      - name: Cache Clojure dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.lein/self-installs
          key: xia-lein-${{ runner.os }}-java-${{ env.JAVA_VERSION }}-lein-${{ env.LEIN_VERSION }}-${{ hashFiles('build/dependencies.edn', 'project.clj') }}

      - name: Run Xia test suite
        run: lein with-profile -user test

  coverage-baseline:
    name: JVM coverage baseline
    needs: jvm-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Xia
        uses: actions/checkout@v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          lein: ${{ env.LEIN_VERSION }}

      - name: Cache Clojure dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.lein/self-installs
          key: xia-lein-${{ runner.os }}-java-${{ env.JAVA_VERSION }}-lein-${{ env.LEIN_VERSION }}-${{ hashFiles('build/dependencies.edn', 'project.clj') }}

      - name: Generate coverage baseline
        run: >-
          lein with-profile -user,-dev,+coverage cloverage
          --output target/coverage
          --codecov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: xia-jvm-coverage
          path: target/coverage
          if-no-files-found: warn
          retention-days: 14

  frontend-static:
    name: Frontend static checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Xia
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20.15.0"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend lint dependencies
        run: npm ci --ignore-scripts

      - name: Audit frontend tooling dependencies
        run: npm audit --audit-level=high --ignore-scripts

      - name: Run syntax and lint checks
        run: npm run check

  installer-integrity:
    name: Installer integrity checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Xia
        uses: actions/checkout@v7.0.1

      - name: Test Unix installer checksum enforcement
        run: sh test/install_checksum_test.sh

      - name: Test PowerShell installer checksum enforcement
        shell: pwsh
        run: ./test/install_checksum_test.ps1

  native-smoke:
    name: Linux native production smoke
    needs:
      - format
      - lint
      - security-tests
      - jvm-tests
      - coverage-baseline
      - frontend-static
      - installer-integrity
    runs-on: ubuntu-24.04
    env:
      XIA_NATIVE_IMAGE_HEAP: 10g
    steps:
      - name: Checkout Xia
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js for SBOM validation
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "20.15.0"

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1.6.3
        with:
          distribution: graalvm
          version: ${{ env.GRAALVM_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Leiningen
        uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          lein: ${{ env.LEIN_VERSION }}

      - name: Cache Clojure dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.lein/self-installs
          key: xia-native-${{ runner.os }}-graal-${{ env.GRAALVM_VERSION }}-lein-${{ env.LEIN_VERSION }}-${{ hashFiles('build/dependencies.edn', 'project.clj', 'resources/META-INF/native-image/**') }}

      - name: Cache Playwright browsers
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: xia-playwright-${{ runner.os }}-${{ hashFiles('build/dependencies.edn') }}

      - name: Compile native binary
        run: bash script/compile-native

      - name: Run production native round-trip smoke
        run: bash script/native-smoke

      - name: Set up pinned Maven for SBOM generation
        run: |
          set -euo pipefail
          maven_home="$(sh script/setup-maven)"
          echo "$maven_home/bin" >> "$GITHUB_PATH"

      - name: Generate and verify native release SBOM
        run: >-
          sh script/generate-sbom
          ci-${GITHUB_SHA::7}
          linux-amd64
          target/native-image/xia
          target/sbom/xia-ci-linux-amd64.cdx.json

      - name: Prepare dependency scan report directory
        run: mkdir -p target/security

      - name: Scan native dependency graph
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          sbom: target/sbom/xia-ci-linux-amd64.cdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: json
          output-file: target/security/xia-ci-linux-amd64.grype.json
          grype-version: ${{ env.GRYPE_VERSION }}
          cache-db: true

      - name: Upload dependency scan report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: xia-linux-amd64-dependency-scan
          path: target/security/xia-ci-linux-amd64.grype.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload native release SBOM
        uses: actions/upload-artifact@v7.0.1
        with:
          name: xia-linux-amd64-sbom
          path: target/sbom/xia-ci-linux-amd64.cdx.json
          if-no-files-found: error
          retention-days: 14
